require "js"

TERM = JS.global[:term]

def skip_intro?
  JS.global[:skipIntro].to_s == "true"
end

# Await a JS timer so the browser stays responsive; no-op once the intro is skipped.
def sleep_ms(ms)
  return if skip_intro?
  JS.global.sleep(ms).await
end

def typewrite(text, delay: 18)
  text.each_char do |char|
    TERM.write(char)
    sleep_ms(delay)
  end
  TERM.write("\r\n")
end

def neural_stream(count = 14)
  chars = ("⠀".."⣿").to_a
  count.times do
    TERM.write(chars.sample)
    sleep_ms(30)
  end
end

def connect(message, result)
  TERM.write(message)
  sleep_ms(250)
  neural_stream
  TERM.write(" #{result}\r\n")
  sleep_ms(150)
end

# Key: @nodoc
class Key < Array
  include Comparable
  attr_reader :name, :rank, :index

  def <=>(other)
    comparison = rank <=> other.rank
    comparison = other.index <=> index if comparison.zero?
    comparison
  end

  def initialize(name = nil, rank = 0, index = 0)
    super()
    @name = name # name of key
    @rank = rank # a precedence
    @index = index # offset of key in original script
  end

  def inspect
    "*** Key#inspect: @name=#{@name}, @rank=#{@rank}, @index=#{@index} " + super
  end

  def to_s
    "*** Key#to_s: @name=#{@name}, @rank=#{@rank}, @index=#{@index} " + super
  end
end

# Memory: @nodoc
class Memory < Array
  def initialize
    super
    @max = 20
  end

  def get
    shift
  end

  def save(string)
    push string
    shift if length > @max
    nil
  end
end

# Decomp: @nodoc
class Decomp < Array
  attr_accessor :pattern
  attr_reader :memory

  def initialize(pattern, memory = false)
    super()
    @pattern = pattern # a regular expression, see Script#initialize
    @memory = memory # save my dialogs in memory?
    @index = nil # locates current reassembly rule
  end

  def next_rule
    raise "error: no reassembly rules for decomp" unless size

    @index ||= rand size
    if @memory
      @index = rand size
    else
      @index += 1
      @index = 0 unless @index.positive? && @index < size
    end
    String.new self[@index]
  end

  def inspect
    "*** Decomp#inspect: @pattern=#{@pattern}, @memory=#{@memory}, @index=#{@index} " + super
  end

  def to_s
    "*** Decomp#to_s: @pattern=#{@pattern}, @memory=#{@memory}, @index=#{@index} " + super
  end
end

# PrePost: @nodoc
class PrePost
  attr_reader :src, :dst

  def initialize(src, dst)
    @src = src
    @dst = dst
  end
end

# Script: @nodoc
class Script
  attr_reader :final, :keys, :quits

  def initialize(input_script)
    @final = ""
    @initial = ""
    @keys = {}
    @post = {}
    @pre = {}
    @quits = []
    @syns = {}

    parse input_script

    # Regular expressions are harder to setup but later results look prettier
    # than stepping thru and comparing multiple arrays of words and '*'s.

    synpat = /@(\w+)/ # synonym notation used in eliza scripts
    @keys.each_value do |key|
      key.each do |decomp| # Key is (also) array of Decomp's, maybe too sneaky...
        while synpat.match(decomp.pattern)
          expr = @syns[Regexp.last_match(1)] or raise "error: unknown synonym: '#{Regexp.last_match(1)}'."
          decomp.pattern = Regexp.last_match.pre_match + "(#{expr})" + Regexp.last_match.post_match
        end
        #puts "final pattern(#{decomp.pattern})"
        decomp.pattern = /#{decomp.pattern}/i
      end
    end
  end

  def pre_translate(str)
    translate(@pre, str)
  end

  def post_translate(str)
    translate(@post, str)
  end

  private

  def parse(input_script)
    key, decomp = nil

    input_script.each_line.with_index do |line, line_number|
      case line
      when /^\s*#/
        # no-op
      when /^\s*final:(.*)/
        @final = Regexp.last_match(1).strip
      when /^\s*initial:(.*)/
        @initial = Regexp.last_match(1).strip
      when /^\s*quit:(.*)/
        @quits.push Regexp.last_match(1).strip
      when /^\s*pre:\s*(\S+)(.*)/
        src, dst = Regexp.last_match(1).downcase, Regexp.last_match(2).strip
        @pre[src] = PrePost.new(src, dst)
      when /^\s*post:\s*(\S+)(.*)/
        src, dst = Regexp.last_match(1).downcase, Regexp.last_match(2).strip
        @post[src] = PrePost.new(src, dst)
      when /^\s*synon:(.*)/
        names = Regexp.last_match(1).downcase.split.sort
        pattern = names.join("|")
        names.each { |name| @syns[name] = pattern }
      when /^\s*key:(.*)/
        name, rank = Regexp.last_match(1).downcase.split
        key = @keys[name] = Key.new(name, rank.to_i, @keys.size - 1)
        decomp = nil
      when /^\s*decomp:\s*(.*)/
        key or raise "(#{line_number}): Error: no key for decomp."
        pattern = Regexp.last_match(1).downcase.gsub("**", "*").gsub("*", " * ").strip.squeeze(" ")
        #puts "=== before: #{pattern} ==="
        words = pattern.split
        if words[0] == "$"
          mem = true
          words.shift
        else
          mem = false
        end
        raise "(#{line_number}): error: empty decomp!" if words.size.zero?

        pattern = ""
        words.each_index do |i|
          if words[i] == "*"
            if i == words.size - 1  # '*' at end of sentence (greedy)
              pattern += "(.*)"
            elsif i.positive? # '*' between words
              pattern += '((?:\s(?:\S+\s)*?)+?)'
            else # '*' at beginning
              pattern += '(\S+ )*?'
            end
          else # words[i] != '*'
            pattern += words[i]
            pattern += " " if i < words.size - 1 && words[i + 1] != "*"
          end
        end
        #puts "=== after: #{pattern} ==="
        key.push(decomp = Decomp.new(pattern, mem))
      when /^\s*reasmb:(.*)/
        decomp or raise "(#{line_number}): Error: no decomp for reasmb!"
        decomp.push Regexp.last_match(1).strip
      else
        $stderr << "Unrecognized script input, line #{line_number}: #{line}\n"
      end
    end
  end

  def translate(map, str)
    (words = str.split).each_index do |i|
      pre_post = map[words[i].downcase]
      words[i] = pre_post.dst if pre_post
    end
    words.join " "
  end
end

# Eliza: @nodoc — browser edition. Input arrives one line at a time from the
# terminal's onData handler, so there is no run loop and no IO streams.
class Eliza
  def initialize(script_content)
    @debug = false
    @done = false
    @memory = Memory.new
    @memory.save("Oh my gosh, I spilled coffee! Sorry, please continue.")
    @script = Script.new script_content
  end

  def done?
    @done
  end

  def process_input(input)
    # Clean up input string, split into sentences.
    #str = input.tr(',?!', '.').gsub(/[^.'\w]/, ' ').strip.squeeze("\s.")
    str = input.tr(",?!", ".").strip.squeeze("\s.")
    sentences = str.split(/\.\s*/)

    # Try each sentence in string.
    sentences.each { |s| (reply = sentence(s)) and return reply }

    # No sentence(), pop next FIFO memory, if any.
    (reply = @memory.get) and return reply
    # No memory, try processing with xnone key.
    results = {}
    if (key = @script.keys["xnone"])
      sentences.each { |s| decompose(s, key, results) and results["reply"] and return results["reply"] }
    end

    # Oh well, just say anything.
    "I am at a loss for words."
  end

  def sentence(s)
    puts %(*** processing sentence "#{s}" ...) if @debug

    results = {} # for results of decomp and assemble

    # Pre-replace any matching source terms with their destination.
    input_sentence = @script.pre_translate(s)

    # Check special case = end of therapy session.
    if @script.quits.include? input_sentence
      @done = true
      return @script.final
    end

    # Patient isn't done, collect all keywords.
    keys = {} # Start as hash,
    input_sentence.split.each do |word|
      keys[word] = @script.keys[word] if @script.keys[word]
    end
    keys = keys.each_value.sort.reverse # end as array, decreasing precedence

    # Try each key for a reply or goto rule.
    keys.each do |key|
      next unless decompose(input_sentence, key, results)
      return results["reply"] if results["reply"]
      # Avoid infinite loops, allow one goto.
      next unless decompose(input_sentence, results["goto_key"], results)
      return results["reply"] if results["reply"]
    end

    # Sorry Charlie, no match found!
    nil
  end

  def decompose(input, key, results)
    puts %(*** decompose "#{input}" on key "#{key.name}") if @debug
    key.each do |decomp|
      md = decomp.pattern.match(input)
      return true if md && assemble(md, decomp, results)
    end
    false
  end

  def assemble(md_input, decomp, results)
    if @debug
      captures = %("#{md_input.captures.join('", "')}")
      puts %(*** assemble "#{decomp.pattern.inspect}" with (#{captures}))
    end
    rule = decomp.next_rule
    if rule =~ /^goto\s+(\w+)/
      raise "error: unknown key '#{Regexp.last_match(1)}'" unless @script.keys[Regexp.last_match(1)]

      return (results["goto_key"] = @script.keys[Regexp.last_match(1)])
    end
    while md_rule = /(\((\d)\))/.match(rule) # e.g., (2) => md_input[2]
      i, arg = Regexp.last_match(2).to_i, "[#{i}]"
      if i.positive? && i < md_input.length
        arg = @script.post_translate(md_input[i])
        rule = md_rule.pre_match + arg + md_rule.post_match
      end
    end
    rule.sub!(/\s*(\W)\Z/) { |match| match = Regexp.last_match(1) }
    @memory.save(rule) if decomp.memory
    results["reply"] = rule
  end
end

ELIZA_SOURCE = script

JS.global.clearInterval(JS.global[:bootTicker])
TERM.write("\r\n\r\n")

connect("Connecting to ground control...", "connected.")
connect("Tracing code name V location...", "location established.")
connect("Establishing neural connection...", "connected.")
TERM.write("\r\n")

typewrite("I sense your presence and appreciate your patience.")
typewrite("Welcome to a safe space in my neural cortex.")
typewrite("Find me at https://github.com/codenamev or https://blog.codenamev.com")
TERM.write("\r\n")
typewrite("In my quest to explore the vast expanse of AI, I present to you")
typewrite("one of the very first NLP programs: \"ELIZA\" (Joseph Weizenbaum, 1966)")
typewrite("https://en.wikipedia.org/wiki/ELIZA")
TERM.write("\r\n")
typewrite("This session is the original Ruby program, compiled to WebAssembly,")
typewrite("running entirely in your browser. Type 'bye' to end the session.")
TERM.write("\r\n")
typewrite("Now presenting, ELIZA...")
TERM.write("\r\n")

JS.global.endIntro

eliza = Eliza.new(ELIZA_SOURCE)
buffer = String.new
ended = false

TERM.write(">> Hello.\r\nPlease state your problem.\r\n>> ")

TERM.onData do |data|
  data.to_s.each_char do |char|
    case char
    when "\r"
      TERM.write("\r\n")
      if ended
        eliza = Eliza.new(ELIZA_SOURCE)
        ended = false
        TERM.write(">> Hello again.\r\nPlease state your problem.\r\n>> ")
      else
        reply = eliza.process_input(buffer)
        TERM.write(">> #{reply}\r\n")
        if eliza.done?
          ended = true
          TERM.write("(press Enter to start a new session)\r\n")
        else
          TERM.write(">> ")
        end
      end
      buffer = String.new
    when "\u007F", "\b"
      unless buffer.empty?
        buffer = buffer[0...-1]
        TERM.write("\b \b")
      end
    when "\u0003" # Ctrl-C clears the current line
      TERM.write("^C\r\n>> ")
      buffer = String.new
    else
      if char.ord >= 32
        buffer = buffer + char
        TERM.write(char)
      end
    end
  end
end
