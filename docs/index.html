    // Any key pressed during the intro fast-forwards it.
    window.skipIntro = false;
    const introListener = term.onData(() => { window.skipIntro = true; });
    window.endIntro = () => { introListener.dispose(); };

    // Line discipline lives here in JavaScript so typed characters echo
    // instantly; the Ruby VM is only entered once per submitted line.
    let lineBuffer = '';
    let lineHandler = null;
    window.onLine = (handler) => { lineHandler = handler; };
    term.onData((data) => {

      for (const ch of data) {

          term.write('\r\n');
          const line = lineBuffer;
          lineBuffer = '';
          lineHandler(line);
        } else if (ch === '\u007F' || ch === '\b') {
          if (lineBuffer.length > 0) {

            term.write('\b \b');

          term.write('^C\r\n');
          lineBuffer = '';
          lineHandler('');
        } else if (ch >= ' ' && lineBuffer.length < 320) {
          // a 1966 punched card held 80 columns; be generous, but not infinite
          lineBuffer += ch;
          term.write(ch);
        }
      }
    });

require "js"

TERM = JS.global[:term]

def skip_intro?
  JS.global[:skipIntro].to_s == "true"
end

# Await a JS timer so the browser stays responsive; no-op once the intro is skipped.
def sleep_ms(ms)
  return if skip_intro?
  JS.global.sleep(ms).await
end

def typewrite(text, delay: 12)
  text.each_char do |char|
    TERM.write(char)
    sleep_ms(delay)
  end
  TERM.write("\r\n")
end

def neural_stream(count = 10)
  chars = ("⠀".."⣿").to_a
  count.times do
    TERM.write(chars.sample)
    sleep_ms(30)
  end
end

def connect(message, result)
  TERM.write(message)
  sleep_ms(150)
  neural_stream
  TERM.write(" #{result}\r\n")
  sleep_ms(150)
end

#
# ELIZA -- a faithful Ruby reconstruction of Joseph Weizenbaum's 1966
# ELIZA/DOCTOR program.
#
# The algorithm follows Weizenbaum's description in "ELIZA - A Computer
# Program For the Study of Natural Language Communication Between Man And
# Machine", Communications of the ACM, January 1966, including details
# recovered from the original MAD-SLIP source code found in the Weizenbaum
# archives at MIT (the keystack, the BUT delimiter, the LIMIT counter, the
# SLIP HASH memory selection and the built-in no-match messages), as
# documented by Anthony Hay's C++ reconstruction:
# https://github.com/anthay/ELIZA (CC0). See also https://elizagen.org.
#
# The browser build embeds a copy of this library in docs/index.html;
# regenerate it with: ruby bin/build_site.rb

module Eliza
  # "the procedure recognizes a comma or a period as a delimiter" [page 37].
  # The MAD-SLIP source shows the word BUT is also treated as a delimiter.
  DELIMITERS = [",", ".", "BUT"].freeze

  # Weizenbaum's built-in responses, used when a script problem prevents a
  # reply being generated. Selected by the LIMIT counter, which cycles 1..4.
  NOMATCH_MESSAGES = ["PLEASE CONTINUE", "HMMM", "GO ON , PLEASE", "I SEE"].freeze

  # IBM 7090/7094 six-bit BCD (Hollerith) character codes. ELIZA ran on a
  # 7094; the MEMORY mechanism hashes words in this encoding.
  HOLLERITH = {}.tap do |h|
    "0123456789".each_char.with_index { |c, i| h[c] = i }
    h["="] = 0o13
    h["'"] = 0o14
    h["+"] = 0o20
    ("A".."I").each_with_index { |c, i| h[c] = 0o21 + i }
    h["."] = 0o33
    h[")"] = 0o34
    h["-"] = 0o40
    ("J".."R").each_with_index { |c, i| h[c] = 0o41 + i }
    h["$"] = 0o53
    h["*"] = 0o54
    h[" "] = 0o60
    h["/"] = 0o61
    ("S".."Z").each_with_index { |c, i| h[c] = 0o62 + i }
    h[","] = 0o73
    h["("] = 0o74
  end.freeze

  module_function

  # Uppercase the text and reduce it to the BCD character set, mapping
  # punctuation ELIZA never saw (?, !, colons, dashes, fancy quotes) onto
  # the delimiters it did, as the keypunch operator effectively had to.
  def normalize(text)
    mapped = +""
    text.each_char do |ch|
      case ch
      when "’"                                    then mapped << "'"
      when "‘", "`", '"', "“", "”", "«", "»", "‹", "›", "‚", "‛", "„", "‟" then mapped << " "
      when "!", "?"                               then mapped << "."
      when ":", ";", "–", "—"                     then mapped << ","
      else mapped << ch
      end
    end
    mapped.upcase.gsub(%r{[^A-Z0-9='+.)($*/,\- ]}, " ")
  end

  # Split normalized text into words; commas and periods are words too.
  # e.g. "MEN ARE ALL ALIKE." -> ["MEN", "ARE", "ALL", "ALIKE", "."]
  def split_user_input(text)
    normalize(text).gsub(/([.,])/, ' \1 ').split
  end

  # The 36-bit BCD encoding of the last SLIP cell of a word: its last chunk
  # of up to six characters, space padded. e.g. "INVENTED" -> "ED    "
  def last_chunk_as_bcd(word)
    chunk = word.empty? ? "" : word[((word.length - 1) / 6) * 6..]
    chunk.ljust(6).each_char.reduce(0) { |acc, c| (acc << 6) | HOLLERITH.fetch(c, c.ord & 0x3F) }
  end

  # The SLIP HASH function: the middle n bits of the square of the least
  # significant 35 bits of d (von Neumann mid-square).
  def slip_hash(d, n)
    d &= 0x7FFFFFFFF
    ((d * d) >> (35 - n / 2)) & ((1 << n) - 1)
  end

  # Match words against a decomposition pattern [page 38 (a)].
  # Pattern elements: 0 (any number of words, leftmost-shortest), a positive
  # integer n (exactly n words), a literal word, [:any, words] for
  # (* WORD ...) groups, or [:tag, names] for (/TAG ...) groups.
  # Returns the matched constituents (one string per element) or nil.
  def match(tags, pattern, words)
    return words.empty? ? [] : nil if pattern.empty?

    element = pattern[0]
    rest = pattern[1..]
    case element
    when 0
      constituent = []
      remaining = words
      loop do
        tail = match(tags, rest, remaining)
        return [constituent.join(" ")] + tail if tail
        return nil if remaining.empty?

        constituent << remaining[0]
        remaining = remaining[1..]
      end
    when Integer
      return nil if words.size < element

      tail = match(tags, rest, words[element..])
      tail && [words[0, element].join(" ")] + tail
    else
      return nil if words.empty? || !first_word_fits?(element, words[0], tags)

      tail = match(tags, rest, words[1..])
      tail && [words[0]] + tail
    end
  end

  def first_word_fits?(element, word, tags)
    case element
    in [:any, group] then group.include?(word)
    in [:tag, names] then names.any? { |name| tags.fetch(name, []).include?(word) }
    else element == word
    end
  end

  # Assemble a reply from reassembly-rule parts: integers index the matched
  # constituents (1-based), everything else is literal text [page 38 (b)].
  def reassemble(parts, constituents)
    parts.flat_map do |part|
      if part.is_a?(Integer)
        part.between?(1, constituents.size) ? constituents[part - 1].split(" ") : ["HMMM"]
      else
        [part]
      end
    end
  end

  # -- script reading (the script is MAD-SLIP list structures) --------------

  # ';' starts a comment; '(' and ')' delimit lists; atoms are whitespace
  # delimited. Returns the top-level expressions as nested arrays of strings.
  def read_expressions(text)
    expressions = []
    stack = [expressions]
    text.each_line do |line|
      line.sub(/;.*/, "").scan(/[()]|[^\s()]+/) do |token|
        case token
        when "(" then stack.push(stack.last.push([]).last)
        when ")" then stack.pop
        else stack.last.push(token)
        end
      end
    end
    expressions
  end
end

module Eliza
  # One decomposition pattern with its reassembly rules. Reassembly rules
  # are cycled through in order, one per use, "so that a repertoire of 4
  # such rules is exhausted before any repetition occurs" [page 41].
  class Transformation
    attr_reader :decomposition, :reassemblies

    def initialize(decomposition, reassemblies)
      @decomposition = decomposition
      @reassemblies = reassemblies
      @next_reassembly = 0
    end

    def next_reassembly
      rule = @reassemblies[@next_reassembly]
      @next_reassembly = (@next_reassembly + 1) % @reassemblies.size
      rule
    end

    def self.decomposition_pattern(list)
      list.map do |element|
        if element.is_a?(Array)
          first = element[0].to_s
          rest = element.drop(1)
          names = ([first[1..]] + rest).reject { |w| w.nil? || w.empty? }
          first.start_with?("*") ? [:any, names] : [:tag, names]
        elsif element.match?(/\A\d+\z/)
          element.to_i
        else
          element
        end
      end
    end

    def self.text_parts(list)
      list.map { |part| part.match?(/\A\d+\z/) ? part.to_i : part }
    end

    def self.parse(list)
      decomposition = decomposition_pattern(list[0])
      reassemblies = list.drop(1).map do |rule|
        if rule == ["NEWKEY"]
          [:newkey]
        elsif (target = KeywordRule.reference_target(rule))
          [:link, target]
        elsif rule[0] == "PRE"
          [:pre, text_parts(rule[1]), KeywordRule.reference_target(rule[2])]
        else
          [:text, text_parts(rule)]
        end
      end
      new(decomposition, reassemblies)
    end
  end
end

module Eliza
  # A keyword and its transformation rules, e.g.
  #   (MY = YOUR 2
  #       ((0 YOUR 0 (/FAMILY) 0)
  #           (TELL ME MORE ABOUT YOUR FAMILY) ...) ...)
  class KeywordRule
    attr_reader :keyword, :substitution, :precedence, :dlist_tags, :link

    def initialize(keyword, substitution: nil, precedence: 0, dlist_tags: [],
                   link: nil, transformations: [])
      @keyword = keyword
      @substitution = substitution
      @precedence = precedence
      @dlist_tags = dlist_tags
      @link = link
      @transformations = transformations
    end

    # (=KEY) and (= KEY) both reference the rule for KEY
    def self.reference_target(list)
      return nil unless list.is_a?(Array) && list[0].is_a?(String)
      return list[1] if list[0] == "=" && list.size == 2
      return list[0][1..] if list.size == 1 && list[0].start_with?("=")

      nil
    end

    def self.parse(expression)
      items = expression.dup
      keyword = items.shift
      options = { transformations: [] }
      until items.empty?
        item = items.shift
        if item == "="
          options[:substitution] = items.shift
        elsif item == "DLIST"
          options[:dlist_tags] = items.shift.flat_map { |t| t == "/" ? [] : [t.delete_prefix("/")] }
        elsif item.is_a?(String) && item.match?(/\A\d+\z/)
          options[:precedence] = item.to_i
        elsif (target = reference_target(item))
          options[:link] = target
        else
          options[:transformations].push(Transformation.parse(item))
        end
      end
      new(keyword, **options)
    end

    # only keywords with transformations (or a reference) join the keystack
    def transformation?
      !@transformations.empty? || !@link.nil?
    end

    # Apply this rule to words (in place for :complete and :pre).
    # Returns [:complete], [:link, keyword], [:newkey] or [:inapplicable].
    def apply(words, tags)
      transformation, constituents = decompose(words, tags)
      unless transformation
        return @link ? [:link, @link] : [:inapplicable]
      end

      kind, *payload = transformation.next_reassembly
      case kind
      when :newkey
        [:newkey]
      when :link
        [:link, payload[0]]
      when :pre # (PRE (reassembly) (=KEY)): transform, then go to KEY
        words.replace(Eliza.reassemble(payload[0], constituents))
        [:link, payload[1]]
      else # :text
        words.replace(Eliza.reassemble(payload[0], constituents))
        [:complete]
      end
    end

    private

    # first decomposition rule matching words, with its matched constituents
    def decompose(words, tags)
      @transformations.each do |transformation|
        constituents = Eliza.match(tags, transformation.decomposition, words)
        return [transformation, constituents] if constituents
      end
      [nil, nil]
    end
  end
end

module Eliza
  # The one MEMORY rule, e.g. (MEMORY MY (0 YOUR 0 = LETS DISCUSS FURTHER
  # WHY YOUR 3) ...). When its keyword tops the keystack a memory is formed
  # using the rule selected by the SLIP HASH of the last word of the input
  # [the MAD-SLIP source; the paper says "selected at random", page 41 (f)].
  class MemoryRule
    def initialize(keyword, transformations)
      @keyword = keyword
      @transformations = transformations
      @memories = []
    end

    def self.parse(expression)
      keyword = expression[1]
      transformations = expression.drop(2).map do |list|
        separator = list.index("=")
        Transformation.new(
          Transformation.decomposition_pattern(list[0...separator]),
          [[:text, Transformation.text_parts(list[separator + 1..])]]
        )
      end
      new(keyword, transformations)
    end

    def create(keyword, words, tags)
      return unless keyword == @keyword

      transformation = @transformations[Eliza.slip_hash(Eliza.last_chunk_as_bcd(words.last), 2)]
      constituents = Eliza.match(tags, transformation.decomposition, words)
      return unless constituents

      @memories.push(Eliza.reassemble(transformation.reassemblies[0][1], constituents).join(" "))
    end

    def memory?
      !@memories.empty?
    end

    def recall
      @memories.shift
    end
  end
end

module Eliza
  # A parsed ELIZA script: greeting, keyword rules, the MEMORY rule, the
  # NONE rule and the DLIST tag map (e.g. "FAMILY" -> [MOTHER, FATHER, ...]).
  class Script
    attr_reader :greeting, :rules, :memory_rule, :none_rule, :tags

    def self.parse(text)
      new(text)
    end

    def initialize(text)
      @greeting = nil
      @rules = {}
      @memory_rule = nil
      @none_rule = nil
      Eliza.read_expressions(text).each { |expression| absorb(expression) }
      @greeting ||= "HELLO"
      @tags = collect_tags
    end

    private

    def absorb(expression)
      return unless expression.is_a?(Array) # skip bare atoms such as START
      return if expression.empty?           # () marks the end of the script

      if @greeting.nil? # the script begins with the greeting
        @greeting = expression.join(" ")
      elsif expression[0] == "MEMORY"
        @memory_rule = MemoryRule.parse(expression)
      else
        rule = KeywordRule.parse(expression)
        if rule.keyword == "NONE"
          # NONE is reserved: typing the word NONE must not trigger it
          @none_rule = rule
        else
          @rules[rule.keyword] = rule
        end
      end
    end

    # e.g. "FAMILY" -> ["MOTHER", "MOM", "DAD", "FATHER", ...]
    def collect_tags
      @rules.each_value.with_object({}) do |rule, tags|
        rule.dlist_tags.each { |tag| (tags[tag] ||= []).push(rule.keyword) }
      end
    end
  end
end

module Eliza
  # The core ELIZA algorithm [1966 CACM paper, pages 37-42].
  class Engine
    def initialize(script)
      @script = script
      @limit = 1 # "a certain counting mechanism" -- cycles 1..4 per response
    end

    def greeting
      @script.greeting
    end

    def response(input)
      words = Eliza.split_user_input(input)
      @limit = @limit % 4 + 1

      keystack = scan(words)

      # No keywords: recall a memory, but only when LIMIT is 4 [page 41 (f)]
      if keystack.empty? && @limit == 4 && @script.memory_rule&.memory?
        return @script.memory_rule.recall
      end

      transform(keystack, words) || none_response(words)
    end

    private

    # Scan for keywords, building the keystack and applying word
    # substitutions in place [page 39 (a), (d)]. Only the first clause
    # containing a keyword is kept [page 37 (c)].
    def scan(words)
      keystack = []
      top_rank = 0
      index = 0
      while index < words.size
        word = words[index]
        if DELIMITERS.include?(word)
          if keystack.empty?
            words.shift(index + 1) # no keyword yet: discard through delimiter
            index = 0
          else
            words.pop(words.size - index) # keyword found: discard the rest
            break
          end
          next
        end
        if (rule = @script.rules[word])
          if rule.transformation?
            if rule.precedence > top_rank
              keystack.unshift(word)
              top_rank = rule.precedence
            else
              keystack.push(word)
            end
          end
          words[index] = rule.substitution if rule.substitution
        end
        index += 1
      end
      keystack
    end

    # Apply the transformation for the top keyword [page 39 (d)].
    # Returns the reply, or nil when the NONE rule should speak instead.
    def transform(keystack, words)
      while (keyword = keystack.shift)
        rule = @script.rules[keyword]
        return NOMATCH_MESSAGES[@limit - 1] unless rule # broken reference

        @script.memory_rule&.create(keyword, words, @script.tags)

        action, target = rule.apply(words, @script.tags)
        case action
        when :complete
          return words.join(" ")
        when :inapplicable # no decomposition matched: script error
          return NOMATCH_MESSAGES[@limit - 1]
        when :link
          keystack.unshift(target)
        when :newkey
          next # try the next keyword in the keystack
        end
      end
      nil # no keywords, or NEWKEY exhausted the keystack
    end

    # "the special reserved keyword NONE" never fails to reply [page 41 (d)]
    def none_response(words)
      @script.none_rule.apply(words, @script.tags)
      words.join(" ")
    end
  end
end
